    window.onerror = function(msg, src, line, col, err) {

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  (function() {
    // Lucide-react: stub all icon names as simple inline boxes
        var _Ico = function(p) {
            p = p || {};
            var s = p.size || p.width || 16;

        title: p.title || '',

      });

    ["Activity","AlertCircle","AlertTriangle","ArrowDown","ArrowDownRight","ArrowLeft","ArrowRight","ArrowUp","ArrowUpRight","BarChart","BarChart2","BarChart3","Bell","Bookmark","Box","Briefcase","Calendar","Camera","Check","CheckCircle","ChevronDown","ChevronLeft","ChevronRight","ChevronUp","Circle","Clock","Cloud","Code","Command","Copy","CreditCard","Database","Delete","Download","Edit","ExternalLink","Eye","EyeOff","File","FileText","Filter","Flag","Folder","Globe","Grid","Hash","Heart","HelpCircle","Home","Image","Info","Layers","Layout","LayoutDashboard","Link","List","Loader","Lock","LogIn","LogOut","Mail","Map","MapPin","Menu","MessageCircle","MessageSquare","Minus","Monitor","Moon","MoreHorizontal","MoreVertical","Move","Music","Package","PenTool","Percent","Phone","PieChart","Play","Plus","Power","Printer","RefreshCw","Save","Search","Send","Server","Settings","Share","Shield","ShoppingBag","ShoppingCart","Sidebar","Sliders","Star","Sun","Table","Tag","Target","Trash","Trash2","TrendingDown","TrendingUp","Twitter","Type","Unlock","Upload","User","UserCheck","UserMinus","UserPlus","Users","Video","Volume","Volume2","Watch","Wifi","X","XCircle","Youtube","Zap","ZoomIn","ZoomOut"].forEach(function(n) { window[n] = _Ico; });

    // framer-motion: pass-through (strips animation props)
    var _animProps = new Set(['initial','animate','exit','transition','variants',
      'whileHover','whileTap','whileFocus','layout','layoutId','drag','dragConstraints']);
    var _motionEl = function(tag) {
      return React.forwardRef(function(props, ref) {
        var clean = {};
        Object.keys(props).forEach(function(k) { if (!_animProps.has(k)) clean[k] = props[k]; });
        clean.ref = ref;
        return React.createElement(tag, clean);
      });
    };
    window.motion = new Proxy({}, { get: function(_, tag) { return _motionEl(tag); } });
    window.AnimatePresence = function(p) { return p.children || null; };

    // recharts: stub chart components as empty divs with a label
    ['LineChart','BarChart','PieChart','AreaChart','RadarChart','ScatterChart',
     'ComposedChart','ResponsiveContainer','XAxis','YAxis','CartesianGrid',
     'Tooltip','Legend','Line','Bar','Pie','Area','Cell','Radar','Scatter',
     'ReferenceLine','ReferenceArea'].forEach(function(n) {
      window[n] = function(p) {
        return React.createElement('div', {
          style:{border:'1px dashed #444',borderRadius:6,padding:8,
                  color:'#888',fontSize:12,display:'flex',alignItems:'center',justifyContent:'center',
                  minHeight: p.height || 200},
          className: p.className
        }, n + ' (chart)');
      };

  })();

<body>
<div id="_cdn-loading">Loading NovaMind AI…</div>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo, useRef, createContext,
        useContext, useReducer, Fragment } = React;
const BASE = window.__BACKEND_URL__ || '';

async function apiFetch(path, opts) {
  opts = opts || {};
  for (var i = 0; i < 3; i++) {
    try {
      var r = await fetch(BASE + path, opts);
      if (r.ok) return r.json();
    } catch(_) {}
    await new Promise(function(res) { setTimeout(res, 1500); });
  }
  return null;
}

const [form, setForm] = useState({ name: '', company: '', value: '', stage: 'Lead' })
  const [errors, setErrors] = useState({})
  const [toast, setToast] = useState(null)

  const validate = () => {
    const errs = {}
    if (!form.name.trim()) errs.name = 'Deal name is required'
    if (!form.company.trim()) errs.company = 'Company is required'
    if (!form.value || isNaN(form.value) || Number(form.value) <= 0) errs.value = 'Enter a valid amount'
    return errs
  }

  const handleSubmit = (e) => {
    e.preventDefault()
    const errs = validate()
    setErrors(errs)
    if (Object.keys(errs).length === 0) {
      setToast({ type: 'success', message: 'Deal created successfully!' })
      setTimeout(() => { setToast(null); onClose() }, 1500)
    }
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={onClose}>
      <div className="glass p-6 max-w-md w-full fade-in" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-6">
          <h2 className="text-lg font-semibold text-slate-200">New Deal</h2>
          <button onClick={onClose} className="p-1 hover:bg-white/5 rounded-lg transition-colors">
            <X size={20} className="text-slate-400" />
          </button>
        </div>

        <form onSubmit={handleSubmit} className="space-y-4">
          <div>
            <label className="block text-sm font-medium text-slate-300 mb-1">Deal Name</label>
            <input
              type="text"
              value={form.name}
              onChange={e => setForm({ ...form, name: e.target.value })}
              className={`w-full bg-white/5 border rounded-lg px-3 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-[#00B4D8]/50 transition-colors ${errors.name ? 'border-red-500' : 'border-white/10'}`}
              placeholder="Enter deal name"
            />
            {errors.name && <p className="text-xs text-red-400 mt-1">{errors.name}</p>}
          </div>
          <div>
            <label className="block text-sm font-medium text-slate-300 mb-1">Company</label>
            <input
              type="text"
              value={form.company}
              onChange={e => setForm({ ...form, company: e.target.value })}
              className={`w-full bg-white/5 border rounded-lg px-3 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-[#00B4D8]/50 transition-colors ${errors.company ? 'border-red-500' : 'border-white/10'}`}
              placeholder="Enter company name"
            />
            {errors.company && <p className="text-xs text-red-400 mt-1">{errors.company}</p>}
          </div>
          <div>
            <label className="block text-sm font-medium text-slate-300 mb-1">Value ($)</label>
            <input
              type="number"
              value={form.value}
              onChange={e => setForm({ ...form, value: e.target.value })}
              className={`w-full bg-white/5 border rounded-lg px-3 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-[#00B4D8]/50 transition-colors ${errors.value ? 'border-red-500' : 'border-white/10'}`}
              placeholder="Enter deal value"
            />
            {errors.value && <p className="text-xs text-red-400 mt-1">{errors.value}</p>}
          </div>
          <div>
            <label className="block text-sm font-medium text-slate-300 mb-1">Stage</label>
            <select
              value={form.stage}
              onChange={e => setForm({ ...form, stage: e.target.value })}
              className="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-[#00B4D8]/50 transition-colors"
            >
              <option value="Lead">Lead</option>
              <option value="Qualified">Qualified</option>
              <option value="Proposal">Proposal</option>
              <option value="Won">Won</option>
            </select>
          </div>
          <button
            type="submit"
            className="w-full px-4 py-2.5 bg-gradient-to-r from-[#00B4D8] to-[#1E3A5F] text-white rounded-lg text-sm font-medium hover:opacity-90 transition-opacity"
          >
            Create Deal
          </button>
        </form>

        {toast && (
          <div className={`fixed bottom-6 right-6 glass px-4 py-3 flex items-center gap-2 fade-in ${
            toast.type === 'success' ? 'text-emerald-400' : 'text-red-400'
          }`}>
            <CheckCircle size={18} />
            <span className="text-sm">{toast.message}</span>
          </div>
        )}
      </div>
    </div>
  )
}

function Contacts() {
  const [contacts, setContacts] = useState(MOCK_CONTACTS)
  const [showNewContact, setShowNewContact] = useState(false)

  const columns = [

      <span className="font-medium text-slate-200">{row.name}</span>
    )},
    { key: 'company', label: 'Company' },
    { key: 'email', label: 'Email' },
    { key: 'phone', label: 'Phone' },
    { key: 'status', label: 'Status', render: (row) => (
      <span className={`inline-flex items-center px-2 py-0.5 text-xs font-medium rounded-full ${
        row.status === 'Active' ? 'bg-emerald-500/10 text-emerald-400' :
        row.status === 'New' ? 'bg-blue-500/10 text-blue-400' :
        'bg-slate-500/10 text-slate-400'
      }`}>
        {row.status}
      </span>
    )},
    { key: 'deals', label: 'Deals' },
    { key: 'revenue', label: 'Revenue', render: (row) => `$${row.revenue.toLocaleString()}` }

  return (

function Deals() {
  const [deals, setDeals] = useState(MOCK_DEALS)
  const [selectedDeal, setSelectedDeal] = useState(null)
  const [showNewDeal, setShowNewDeal] = useState(false)

  const totalPipeline = deals.reduce((sum, d) => sum + d.value, 0)
  const wonDeals = deals.filter(d => d.stage === 'Won')
  const wonRevenue = wonDeals.reduce((sum, d) => sum + d.value, 0)

  const columns = [
    { key: 'name', label: 'Deal Name', render: (row) => (
      <span className="font-medium text-slate-200">{row.name}</span>
    )},
    { key: 'company', label: 'Company' },
    { key: 'value', label: 'Value', render: (row) => `$${row.value.toLocaleString()}` },
    { key: 'stage', label: 'Stage', render: (row) => (
      <span className={`inline-flex items-center px-2 py-0.5 text-xs font-medium rounded-full ${
        row.stage === 'Won' ? 'bg-emerald-500/10 text-emerald-400' :
        row.stage === 'Proposal' ? 'bg-blue-500/10 text-blue-400' :
        row.stage === 'Qualified' ? 'bg-amber-500/10 text-amber-400' :
        'bg-slate-500/10 text-slate-400'
      }`}>
        {row.stage}
      </span>
    )},
    { key: 'owner', label: 'Owner' },
    { key: 'probability', label: 'Probability', render: (row) => `${row.probability}%` }
  ]

  return (
    <div className="space-y-6 p-6">
      <div className="flex items-center justify-between">
        <h2 className="text-xl font-semibold text-slate-200">Deals</h2>
        <button

          New Deal

          <div className="text-xs text-slate-500 mb-1">Pipeline Value</div>
          <div className="text-xl font-bold text-slate-200">${totalPipeline.toLocaleString()}</div>
        </div>
        <div className="glass p-4">
          <div className="text-xs text-slate-500 mb-1">Deals Won</div>
          <div className="text-xl font-bold text-emerald-400">{wonDeals.length}</div>
        </div>
        <div className="glass p-4">
          <div className="text-xs text-slate-500 mb-1">Revenue from Won</div>
          <div className="text-xl font-bold text-slate-200">${wonRevenue.toLocaleString()}</div>
        </div>
      </div>

      <DataTable columns={columns} data={deals} onRowClick={setSelectedDeal} />

      {selectedDeal && <DealModal deal={selectedDeal} onClose={() => setSelectedDeal(null)} />}

    </div>
  )
}

function Activities() {
  const [activities, setActivities] = useState(MOCK_ACTIVITIES)
  const [filter, setFilter] = useState('all')

  const filtered = filter === 'all' ? activities : activities.filter(a => a.type === filter)

  const stats = {
    total: activities.length,
    calls: activities.filter(a => a.type === 'call').length,
    emails: activities.filter(a => a.type === 'email').length,
    meetings: activities.filter(a => a.type === 'meeting').length
  }

  return (
    <div className="space-y-6 p-6">
      <div className="flex items-center justify-between">
        <h2 className="text-xl font-semibold text-slate-200">Activities</h2>
        <button className="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-[#00B4D8] to-[#1E3A5F] text-white rounded-lg text-sm font-medium hover:opacity-90 transition-opacity">
          <Plus size={16} />
          Log Activity
        </button>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
        <div className="glass p-4">

          <div className="text-xl font-bold text-slate-200">{stats.total}</div>
        </div>
        <div className="glass p-4">
          <div className="text-xs text-slate-500 mb-1">Calls</div>
          <div className="text-xl font-bold text-emerald-400">{stats.calls}</div>
        </div>
        <div className="glass p-4">
          <div className="text-xs text-slate-500 mb-1">Emails</div>
          <div className="text-xl font-bold text-blue-400">{stats.emails}</div>
        </div>
        <div className="glass p-4">
          <div className="text-xs text-slate-500 mb-1">Meetings</div>
          <div className="text-xl font-bold text-purple-400">{stats.meetings}</div>
        </div>
      </div>

      <div className="flex gap-1 bg-white/5 rounded-lg p-0.5 w-fit">
        {['all', 'call', 'email', 'meeting'].map(type => (
          <button
            key={type}
            onClick={() => setFilter(type)}
            className={`px-3 py-1.5 text-xs rounded-md transition-all capitalize ${
              filter === type ? 'bg-[#00B4D8]/20 text-[#00B4D8]' : 'text-slate-400 hover:text-slate-200'

          >

  )

            <div className="flex items-center gap-2 mb-2">
              <Target size={16} className="text-[#00B4D8]" />

            <div className="text-sm text-slate-400">Sarah K. closed $450K this quarter</div>
          </div>
          <div className="glass p-4 hover-card">

}

function App() {
  const [activePage, setActivePage] = useState('dashboard')
  const [sidebarOpen, setSidebarOpen] = useState(false)

  const pages = {
    dashboard: Dashboard,
    contacts: Contacts,
    deals: Deals,
    pipeline: Pipeline,
    activities: Activities,
    reports: Reports
  }

  const Page = pages[activePage] || Dashboard

  return (
    <div className="flex h-screen bg-[#06080f] text-slate-200">
      <CssInjection />
      <Sidebar activePage={activePage} setActivePage={setActivePage} isOpen={sidebarOpen} setIsOpen={setSidebarOpen} />
      <div className="flex-1 flex flex-col min-w-0">
        <TopBar activePage={activePage} setIsOpen={setSidebarOpen} />
        <main className="flex-1 overflow-y-auto">
          <Page />
        </main>
      </div>
      <div id="portal-root" />
    </div>
  )
}

// Hide loading overlay and render
var _loading = document.getElementById('_cdn-loading');
if (_loading) _loading.style.display = 'none';
ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(React.StrictMode, null, React.createElement(App))
);
</script>
