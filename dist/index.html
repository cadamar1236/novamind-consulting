function useLocalStorage(key, initialValue) {
  const [storedValue, setStoredValue] = useState(() => {
    try {
      const item = localStorage.getItem(key)
      return item ? JSON.parse(item) : initialValue
    } catch {
      return initialValue
    }
  })

  const setValue = (value) => {
    try {
      const valueToStore = value instanceof Function ? value(storedValue) : value
      setStoredValue(valueToStore)
      localStorage.setItem(key, JSON.stringify(valueToStore))
    } catch (error) {
      console.error(error)
    }
  }

  return [storedValue, setValue]
}

function useAuth() {
  const [user, setUser] = useLocalStorage('nc_user', null)

  const login = useCallback((email, password) => {
    const userData = { name: email.split('@')[0], email, plan: 'enterprise', joinedAt: Date.now() }
    setUser(userData)
    return userData
  }, [setUser])

  const signup = useCallback((userData) => {
    const newUser = { ...userData, plan: 'enterprise', joinedAt: Date.now() }
    setUser(newUser)
    return newUser
  }, [setUser])

  const logout = useCallback(() => {
    setUser(null)
  }, [setUser])

  return { user, login, signup, logout }
}

          {sidebarItems.map(item => {
            const Icon = item.icon
            return (
              <button
                key={item.id}
                onClick={() => setCurrentView(item.id)}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all ${
                  currentView === item.id 
                    ? 'bg-[#1a3a5c]/20 text-[#f4a261] border border-[#f4a261]/10' 
                    : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'
                }`}
              >
                <Icon size={18} />
                <span>{item.label}</span>
              </button>
            )
          })}
        </nav>

        <div className="p-4 border-t border-white/5">
          <div className="flex items-center gap-3 mb-3">
            <div className="w-8 h-8 rounded-full bg-gradient-to-br from-[#1a3a5c] to-[#f4a261] flex items-center justify-center text-xs font-bold">
              {user.name.charAt(0).toUpperCase()}
            </div>
            <div className="flex-1 min-w-0">
              <p className="text-sm font-medium text-slate-200 truncate">{user.email}</p>
              <p className="text-xs text-slate-500">Enterprise Plan</p>
            </div>
          </div>
          <button 
            onClick={onLogout}
            className="w-full flex items-center gap-2 px-3 py-2 text-sm text-slate-400 hover:text-red-400 hover:bg-white/5 rounded-lg transition-all"
          >
            <LogOutPanel size={16} />
            Sign Out
          </button>
        </div>
      </aside>

      {/* Main Content */}
      <div className="flex-1 flex flex-col overflow-hidden">
        {/* Top Bar */}
        <header className="h-14 flex items-center justify-between px-6 border-b border-white/5 flex-shrink-0">
          <div className="flex items-center gap-4">
            <h2 className="text-lg font-semibold text-slate-200 capitalize">
              {currentView === 'dashboard' ? 'Dashboard' : 
               currentView === 'strategy' ? 'Strategy Recommendations' :
               currentView === 'market-analysis' ? 'Market Analysis' :
               currentView === 'clients' ? 'Client Portfolio' :
               currentView === 'reports' ? 'Reports & Analytics' :
               'SettingsPanel'}
            </h2>
          </div>
          <div className="flex items-center gap-3">
            <button className="p-2 hover:bg-white/5 rounded-lg transition-colors relative">
              <BellPanel size={18} className="text-slate-400" />
              <span className="absolute top-1 right-1 w-2 h-2 bg-[#f4a261] rounded-full" />
            </button>
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-full bg-gradient-to-br from-[#1a3a5c] to-[#f4a261] flex items-center justify-center text-xs font-bold">
                {user.name.charAt(0).toUpperCase()}
              </div>
              <span className="text-sm text-slate-300">{user.email}</span>
            </div>
          </div>
        </header>

        {/* Welcome Banner */}
        {showWelcomeBanner && (
          <div className="mx-6 mt-6 p-4 glass rounded-lg flex items-center justify-between fade-in">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-lg bg-[#f4a261]/20 flex items-center justify-center">
                <StarPanel size={20} className="text-[#f4a261]" />
              </div>
              <div>
                <p className="text-sm font-medium text-slate-200">
                  Welcome, {user.name}! Your Enterprise account is ready.
                </p>
                <p className="text-xs text-slate-400">
                  Start your 50% faster market entry analysis now.
                </p>
              </div>
            </div>
            <button 
              onClick={() => setShowWelcomeBanner(false)}
              className="p-1 hover:bg-white/5 rounded-lg transition-colors"
            >
              <XPanel size={16} className="text-slate-400" />
            </button>
          </div>
        )}

        {/* Page Content */}
        <main className="flex-1 overflow-y-auto p-6">
          {currentView === 'dashboard' && <Dashboard showToast={showToast} />}
          {currentView === 'strategy' && <StrategyPage />}
          {currentView === 'market-analysis' && <MarketAnalysisPage />}
          {currentView === 'clients' && <ClientsPage />}
          {currentView === 'reports' && <ReportsPage />}
          {currentView === 'settings' && <SettingsPage user={user} />}
        </main>
      </div>
    </div>
  )
}

function Dashboard({ showToast }) {
  const [metrics, setMetrics] = useState(null)
  const [activity, setActivity] = useState([])
  const [chartData, setChartData] = useState(null)
  const [loading, setLoading] = useState(true)
  const [timeRange, setTimeRange] = useState('week')

  useEffect(() => {
    const fetchData = async () => {
      const [m, a, c] = await Promise.all([
        apiFetch('/api/metrics'),
        apiFetch('/api/recent-activity'),
        apiFetch('/api/chart-data')
      ])
      setMetrics(m)
      setActivity(a || [])
      setChartData(c)
      setLoading(false)
    }
    fetchData()
  }, [])

  if (loading) {
    return (
      <div className="space-y-6">
        <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
          {[1,2,3,4].map(i => (
            <div key={i} className="glass p-5 shimmer h-24" />
          ))}
        </div>
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div className="glass p-5 shimmer h-64" />
          <div className="glass p-5 shimmer h-64" />
        </div>
      </div>
    )
  }

  const impactData = chartData?.impact || []
  const successRateData = chartData?.success_rate || []

  return (
    <div className="space-y-6">
      {/* KPI Cards */}
      <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
        <div className="glass p-5 fade-in">
          <div className="flex items-center justify-between mb-3">
            <div className="w-10 h-10 rounded-lg bg-emerald-500/20 flex items-center justify-center">
              <TrendingUpPanel size={20} className="text-emerald-400" />
            </div>
            <span className="flex items-center gap-0.5 text-xs font-medium px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400">
              <ArrowUpPanel size={12} />
              12.5%
            </span>
          </div>
          <div className="text-xs text-slate-400 mb-1">Analysis Speed</div>
          <div className="text-2xl font-bold text-slate-200">{metrics?.analysis_speed || '50%'} faster</div>
          <div className="text-xs text-slate-500 mt-1">vs. traditional methods</div>
        </div>

        <div className="glass p-5 fade-in" style={{ animationDelay: '50ms' }}>
          <div className="flex items-center justify-between mb-3">
            <div className="w-10 h-10 rounded-lg bg-blue-500/20 flex items-center justify-center">
              <Award size={20} className="text-blue-400" />
            </div>
            <span className="flex items-center gap-0.5 text-xs font-medium px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400">
              <ArrowUpPanel size={12} />
              3.2%
            </span>
          </div>
          <div className="text-xs text-slate-400 mb-1">Strategy Accuracy</div>
          <div className="text-2xl font-bold text-slate-200">{metrics?.accuracy || '95'}%</div>
          <div className="text-xs text-slate-500 mt-1">AI-powered recommendations</div>
        </div>

        <div className="glass p-5 fade-in" style={{ animationDelay: '100ms' }}>
          <div className="flex items-center justify-between mb-3">
            <div className="w-10 h-10 rounded-lg bg-purple-500/20 flex items-center justify-center">
              <UsersPanel size={20} className="text-purple-400" />
            </div>
            <span className="flex items-center gap-0.5 text-xs font-medium px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400">
              <ArrowUpPanel size={12} />
              8.7%
            </span>
          </div>
          <div className="text-xs text-slate-400 mb-1">Fortune 500 Clients</div>
          <div className="text-2xl font-bold text-slate-200">{metrics?.clients || '200'}+</div>
          <div className="text-xs text-slate-500 mt-1">Active engagements</div>
        </div>

        <div className="glass p-5 fade-in" style={{ animationDelay: '150ms' }}>
          <div className="flex items-center justify-between mb-3">
            <div className="w-10 h-10 rounded-lg bg-amber-500/20 flex items-center justify-center">
              <ClockPanel size={20} className="text-amber-400" />
            </div>
            <span className="flex items-center gap-0.5 text-xs font-medium px-2 py-0.5 rounded-full bg-red-500/10 text-red-400">
              <ArrowDownPanel size={12} />
              50%
            </span>
          </div>
          <div className="text-xs text-slate-400 mb-1">Market Entry Time</div>
          <div className="text-2xl font-bold text-slate-200">{metrics?.entry_time || '6'} weeks</div>
          <div className="text-xs text-slate-500 mt-1">Down from 12 weeks</div>
        </div>
      </div>

      {/* Charts */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div className="glass p-5">
          <h3 className="text-sm font-semibold text-slate-300 mb-4">Strategy Impact Score</h3>
          <div className="flex gap-1 bg-white/5 rounded-lg p-0.5 w-fit mb-4">
            {['week', 'month', 'year'].map(range => (
              <button
                key={range}
                onClick={() => setTimeRange(range)}
                className={`px-3 py-1.5 text-xs rounded-md transition-all ${
                  timeRange === range ? 'bg-[#f4a261]/20 text-[#f4a261]' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                {range.charAt(0).toUpperCase() + range.slice(1)}
              </button>
            ))}
          </div>
          <LineChart data={impactData} height={200} />
        </div>
        <div className="glass p-5">
          <h3 className="text-sm font-semibold text-slate-300 mb-4">Market Entry Success Rate</h3>
          <BarChart data={successRateData} height={200} />
        </div>
      </div>

      {/* Recent ActivityPanel */}
      <div className="glass p-5">
        <h3 className="text-sm font-semibold text-slate-300 mb-4">Recent Strategy Sessions</h3>
        {(activity || []).length === 0 ? (
          <div className="text-center py-12">
            <div className="w-12 h-12 mx-auto rounded-lg bg-[#f4a261]/20 flex items-center justify-center mb-4">
              <TargetPanel size={24} className="text-[#f4a261]" />
            </div>
            <p className="text-sm text-slate-400 mb-2">No strategy sessions yet</p>
            <button className="text-sm text-[#f4a261] hover:underline">
              Run your first analysis
            </button>
          </div>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="border-b border-white/5">
                  <th className="text-left py-3 px-2 text-slate-500 font-medium">Session</th>
                  <th className="text-left py-3 px-2 text-slate-500 font-medium">Client</th>

// Hide loading overlay and render
var _loading = document.getElementById('_cdn-loading');
if (_loading) _loading.style.display = 'none';
ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(React.StrictMode, null, React.createElement(App))
);
</script>
</body>
