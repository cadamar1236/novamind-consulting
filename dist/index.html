function KPICard({ icon: Icon, label, value, delta, trend, delay }) {
  const [count, setCount] = useState(0);
  const animRef = useRef(null);

  useEffect(() => {
    const numericValue = parseInt(value.replace(/[^0-9]/g, ''));
    if (isNaN(numericValue)) { setCount(value); return; }
    
    const duration = 1200;
    const steps = 30;
    const increment = numericValue / steps;
    let current = 0;
    const prefix = value.startsWith('$') ? '$' : '';
    
    let i = 0;
    animRef.current = setInterval(() => {
      i++;
      if (i >= steps) {
        setCount(prefix + numericValue.toLocaleString());
        clearInterval(animRef.current);
      } else {
        current += increment;
        setCount(prefix + Math.round(current).toLocaleString());
      }
    }, duration / steps);

    return () => clearInterval(animRef.current);
  }, [value]);

  return (
    <div className="glass p-5 fade-in" style={{ animationDelay: `${delay}ms` }}>
      <div className="flex items-start justify-between mb-3">
        <div className="p-2 rounded-lg bg-white/5">
          <Icon className="w-5 h-5 text-[#00BFA5]" />
        </div>
        {delta !== undefined && (
          <div className={`flex items-center gap-1 text-xs font-medium px-2 py-0.5 rounded-full ${
            trend === 'up' ? 'text-green-400 bg-green-400/10' : 'text-red-400 bg-red-400/10'
          }`}>
            {trend === 'up' ? <ArrowUp className="w-3 h-3" /> : <ArrowDown className="w-3 h-3" />}
            {delta}%
          </div>
        )}
      </div>
      <div className="text-2xl font-bold text-slate-100 mb-1 count-up">{count}</div>
      <div className="text-xs text-slate-400">{label}</div>
    </div>
  );
}

function LineChart({ data, height = 200 }) {
  const width = 600;
  const padding = { top: 20, right: 20, bottom: 30, left: 40 };
  const chartWidth = width - padding.left - padding.right;
  const chartHeight = height - padding.top - padding.bottom;
  const [animate, setAnimate] = useState(false);

  useEffect(() => {
    setTimeout(() => setAnimate(true), 300);
  }, []);

  const maxVal = Math.max(...(data || []).map(d => d.value));
  const minVal = Math.min(...(data || []).map(d => d.value));
  const range = maxVal - minVal || 1;

  const points = (data || []).map((d, i) => {
    const x = padding.left + (i / (data.length - 1)) * chartWidth;
    const y = padding.top + chartHeight - ((d.value - minVal) / range) * chartHeight;
    return `${x},${y}`;
  }).join(' ');

  const areaPoints = (data || []).map((d, i) => {
    const x = padding.left + (i / (data.length - 1)) * chartWidth;
    const y = padding.top + chartHeight - ((d.value - minVal) / range) * chartHeight;
    return `${x},${y}`;
  }).join(' ') + ` ${padding.left + chartWidth},${padding.top + chartHeight} ${padding.left},${padding.top + chartHeight}`;

  const yLabels = [];
  for (let i = 0; i <= 4; i++) {
    yLabels.push(Math.round(minVal + (range * i) / 4));
  }

  return (
    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto">
      <defs>
        <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#00BFA5" stopOpacity="0.3" />
          <stop offset="100%" stopColor="#00BFA5" stopOpacity="0" />
        </linearGradient>
      </defs>
      
      {yLabels.map((label, i) => {
        const y = padding.top + chartHeight - (i / 4) * chartHeight;
        return (
          <g key={i}>
            <line x1={padding.left} y1={y} x2={padding.left + chartWidth} y2={y} stroke="rgba(255,255,255,0.05)" strokeDasharray="3,3" />
            <text x={padding.left - 8} y={y + 4} textAnchor="end" className="text-[10px] fill-slate-500">{label}</text>
          </g>
        );
      })}

      {(data || []).map((d, i) => {
        const x = padding.left + (i / (data.length - 1)) * chartWidth;
        return (
          <text key={i} x={x} y={height - 8} textAnchor="middle" className="text-[10px] fill-slate-500">{d.label}</text>
        );
      })}

      <polygon
        points={areaPoints}
        fill="url(#lineGrad)"
        className="transition-all duration-1000"
        style={{ opacity: animate ? 1 : 0 }}
      />
      
      <polyline
        points={points}
        fill="none"
        stroke="#00BFA5"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        className="transition-all duration-1000"
        style={{ opacity: animate ? 1 : 0 }}
      />

      {(data || []).map((d, i) => {
        const x = padding.left + (i / (data.length - 1)) * chartWidth;
        const y = padding.top + chartHeight - ((d.value - minVal) / range) * chartHeight;
        return (
          <circle
            key={i}
            cx={x}
            cy={y}
            r="4"
            fill="#00BFA5"
            stroke="#06080f"
            strokeWidth="2"
            className="transition-all duration-500"
            style={{ opacity: animate ? 1 : 0, transitionDelay: `${i * 100}ms` }}
          />
        );
      })}
    </svg>
  );
}

}

function DataTable({ data, columns }) {
  const [sortField, setSortField] = useState(null);
  const [sortDir, setSortDir] = useState('asc');

  const sortedData = useMemo(() => {
    if (!sortField) return data || [];
    return [...(data || [])].sort((a, b) => {
      const aVal = a[sortField];
      const bVal = b[sortField];
      if (typeof aVal === 'string') {
        return sortDir === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
      }
      return sortDir === 'asc' ? aVal - bVal : bVal - aVal;
    });
  }, [data, sortField, sortDir]);

  const handleSort = (field) => {
    if (sortField === field) {
      setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    } else {
      setSortField(field);
      setSortDir('asc');
    }
  };

  return (
    <div className="overflow-x-auto">
      <table className="w-full">
        <thead>
          <tr className="border-b border-white/5">
            {(columns || []).map(col => (
              <th
                key={col.key}
                onClick={() => col.sortable !== false && handleSort(col.key)}
                className={`text-left text-xs font-medium text-slate-400 px-3 py-3 ${col.sortable !== false ? 'cursor-pointer hover:text-slate-200' : ''}`}
              >
                <div className="flex items-center gap-1">
                  {col.label}
                  {sortField === col.key && (
                    <span className="text-[#00BFA5]">{sortDir === 'asc' ? '↑' : '↓'}</span>
                  )}
                </div>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {(sortedData || []).map((row, i) => (
            <tr key={i} className="border-b border-white/5 hover:bg-white/[0.02] transition-colors">
              {(columns || []).map(col => (
                <td key={col.key} className="px-3 py-3 text-sm text-slate-300">
                  {col.render ? col.render(row[col.key], row) : row[col.key]}
                </td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

    { key: 'priority', label: 'Priority', render: (val) => (
      <span className={`text-xs ${
        val === 'High' ? 'text-red-400' : val === 'Medium' ? 'text-yellow-400' : 'text-slate-400'
      }`}>{val}</span>
    )},
  ];

  return (
    <div>
      <div className="mb-6">
        <h1 className="text-xl font-bold gradient-text">Dashboard Overview</h1>
        <p className="text-sm text-slate-400 mt-1">AI-powered insights for data-driven business strategy</p>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">
        {(kpiData || []).map((kpi, i) => (
          <KPICard key={i} {...kpi} delay={i * 100} />
        ))}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
        <div className="lg:col-span-2 glass p-5 fade-in">
          <div className="flex items-center justify-between mb-4">
            <h3 className="text-sm font-semibold text-slate-200">Weekly Trend</h3>
            <select className="bg-white/5 border border-white/10 rounded-lg px-2 py-1 text-xs text-slate-400 focus:outline-none focus:border-[#00BFA5]/50">
              <option>Last 7 days</option>
              <option>Last 30 days</option>
            </select>
          </div>
          <LineChart data={chartData} />
        </div>
        <div className="glass p-5 fade-in">
          <div className="flex items-center justify-between mb-4">
            <h3 className="text-sm font-semibold text-slate-200">Industry Coverage</h3>
            <TrendingUp className="w-4 h-4 text-[#00BFA5]" />
          </div>
          <BarChart data={barData} />
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="lg:col-span-2 glass p-5 fade-in">
          <div className="flex items-center justify-between mb-4">
            <h3 className="text-sm font-semibold text-slate-200">Recent Activity</h3>
            <button className="text-xs text-[#00BFA5] hover:underline">View All</button>
          </div>
          <DataTable data={activityData} columns={columns} />
        </div>
        <QuickActions />
      </div>
    </div>
  );
}

function Analytics() {
  return (
    <div className="p-6">
      <h1 className="text-xl font-bold gradient-text mb-4">Analytics</h1>
      <div className="glass p-5 fade-in">
        <p className="text-slate-400">Advanced AI analytics dashboard coming soon. Real-time market predictions, client performance metrics, and strategic insights will be displayed here.</p>
      </div>
    </div>
  );
}

function Reports() {
  return (
    <div className="p-6">
      <h1 className="text-xl font-bold gradient-text mb-4">Reports</h1>
      <div className="glass p-5 fade-in">
        <p className="text-slate-400">Custom report generation module. Generate AI-powered strategic reports, market analyses, and client presentations with one click.</p>
      </div>
    </div>
  );
}

function Settings() {
  return (
    <div className="p-6">
      <h1 className="text-xl font-bold gradient-text mb-4">Settings</h1>
      <div className="glass p-5 fade-in space-y-4">
        <p className="text-slate-400">Configure AI model parameters, notification preferences, and team collaboration settings.</p>
        <div className="p-3 bg-white/[0.02] rounded-lg">
          <label className="text-sm text-slate-300">AI Sensitivity Threshold</label>
          <input type="range" className="w-full mt-2 accent-[#00BFA5]" />
        </div>
      </div>
    </div>
  );

export default function App() {
  const [activePage, setActivePage] = useState('dashboard');
  const [menuOpen, setMenuOpen] = useState(false);

  return (
    <>
      <CSSInjection />
      <div className="flex h-screen overflow-hidden bg-[#06080f] text-slate-100">
        <Sidebar activePage={activePage} setActivePage={setActivePage} isOpen={menuOpen} setIsOpen={setMenuOpen} />
        <div className="flex-1 flex flex-col overflow-hidden">
          <TopBar menuOpen={menuOpen} setMenuOpen={setMenuOpen} />
          <main className="flex-1 overflow-y-auto p-6 scrollbar-custom">
            {activePage === 'dashboard' && <Dashboard />}
            {activePage === 'analytics' && <Analytics />}
            {activePage === 'reports' && <Reports />}
            {activePage === 'settings' && <Settings />}
          </main>
        </div>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(React.StrictMode, null, React.createElement(App))
);
</script>
